name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - name: shellcheck install.sh
        run: shellcheck install.sh   # preinstalled on ubuntu runners

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Unit and integration tests (end-to-end suite excluded)
        run: python -m pytest -q -m "not e2e"

  installers:
    # Installs Axon from this checkout with the standalone installers (the same code path as the
    # curl | bash and irm | iex one-liners), runs it, then uninstalls it.
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install.sh (piped, venv method)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -s -- --method venv --source "$GITHUB_WORKSPACE" --no-modify-path < install.sh  # as curl | bash
          "$HOME/.local/bin/axon" --version
          "$HOME/.local/bin/axon" --help > /dev/null
          bash install.sh --uninstall
          test ! -e "$HOME/.local/bin/axon"
          test ! -e "$HOME/.axon/venv"

      - name: install.ps1 (Windows PowerShell 5.1, file, venv method)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Method venv -Source "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\.axon\bin\axon.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: install.ps1 (PowerShell 7, iex upgrade, then uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AXON_INSTALL_METHOD = 'venv'
          $env:AXON_INSTALL_SOURCE = $env:GITHUB_WORKSPACE
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          if ($AxonInstallExitCode -ne 0) { exit $AxonInstallExitCode }
          axon --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\AXON_INSTALL_SOURCE
          & ([scriptblock]::Create((Get-Content -Raw .\install.ps1))) -Uninstall
          if (Test-Path "$env:USERPROFILE\.axon\venv") { throw 'venv was not removed' }
