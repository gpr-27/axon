[build-system]
requires = ["setuptools>=64"]  # 64+: PEP 660 editable installs; 62.3+: "**" globs in package-data
build-backend = "setuptools.build_meta"

[project]
name = "axon-terminal"
dynamic = ["version"]
description = "A glass-box agentic coding assistant for the terminal: see every LLM call, tool, token, cache hit and cent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Praneeth" }]
keywords = [
  "ai", "agent", "coding-assistant", "llm", "cli", "terminal", "anthropic", "openai",
  "mcp", "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "tomli>=1.1.0; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "beautifulsoup4>=4.12.0",
  "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/gpr-27/axon"
Repository = "https://github.com/gpr-27/axon"
Documentation = "https://github.com/gpr-27/axon/tree/main/docs"
Issues = "https://github.com/gpr-27/axon/issues"
Changelog = "https://github.com/gpr-27/axon/blob/main/src/axon/CHANGELOG.md"

[project.scripts]
axon = "axon.cli:main"
axon-terminal = "axon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "axon.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["axon*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.toml", "*.txt", "py.typed"]
"axon.features" = ["templates/*/template.json", "templates/**/*.tmpl", "agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end test running the real axon CLI against a fake LLM server",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
  "E501",  # long lines are allowed where they read better (line-length guides the formatter)
  "E702",  # a few deliberate `a; b` one-liners
  "E741",  # short loop names such as `l` are used intentionally
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F401", "F811", "F841"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
